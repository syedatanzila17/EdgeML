<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="256" rx="110" fill="url(#glow)"/>
  <!-- AI text arc circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <!-- Play triangle -->
  <polygon points="196,168 196,344 368,256" fill="white" opacity="0.95"/>
  <!-- Small AI dot accent -->
  <circle cx="340" cy="168" r="20" fill="rgba(255,255,255,0.6)"/>
  <circle cx="340" cy="168" r="10" fill="white"/>
</svg>
